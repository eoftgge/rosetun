contents = "Contents"
toc = "On this page"
pager = "Previous and next"
banner = "Stable release: see downloads."

[extra]
# Content-Security-Policy per kind of page: the home page alone loads a script.
csp = "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
csp_home = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'"
