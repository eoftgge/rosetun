name: Pages

on:
  release:
    types: [published]
  push:
    branches: [master, dev]
    paths: ['Cargo.toml', 'site/**', 'tools/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'push' && github.ref_name == 'dev' && 'check' || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && 'master' || github.ref }}
          persist-credentials: false
      # The Zola version and the SHA-256 of its archive are pinned in tools/site/zola.toml;
      # the script checks the hash before it unpacks anything.
      - name: Install the pinned Zola
        run: |
          python3 tools/site/install_zola.py --directory "$RUNNER_TEMP/zola"
          echo "$RUNNER_TEMP/zola" >> "$GITHUB_PATH"
      - name: Check site and bilingual documentation
        run: |
          zola --root site build --output-dir target/site
          python3 tools/site/check.py target/site
          zola --root site check --skip-external-links
          python3 -m unittest discover -s tools/site -p 'test_*.py'
      - name: Fill stable release data
        if: github.event_name != 'push' || github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/site/release.py
          zola --root site build --output-dir _site
          python3 tools/site/check.py _site --rendered
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'push' || github.ref_name == 'master'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'release' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
