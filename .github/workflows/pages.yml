name: Pages

on:
  release:
    types: [published]
  push:
    branches: [master, dev]
    paths: ['site/**', 'tools/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  # Releases created with GITHUB_TOKEN do not emit another workflow run.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'push' && github.ref_name == 'dev' && 'check' || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'workflow_run' || github.event_name == 'release') && 'master' || github.ref }}
          persist-credentials: false
      - name: Check source
        run: |
          python3 tools/site/check.py site
          python3 -m unittest discover -s tools/site -p 'test_*.py'
      - name: Fill stable release data
        if: github.event_name != 'push' || github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/site/release.py --output _site
          python3 tools/site/check.py _site --rendered
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'push' || github.ref_name == 'master'
        with:
          path: _site

  deploy:
    needs: build
    if: >-
      github.event_name == 'release' || github.event_name == 'workflow_run' ||
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
