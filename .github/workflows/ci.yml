name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: '1.96.0'
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install Rust toolchain.' }
          rustup default $env:RUST_TOOLCHAIN
          if ($LASTEXITCODE -ne 0) { throw 'Failed to select Rust toolchain.' }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked

  commits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check commit messages and added lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch or a rewritten history has no usable "before": check the last commit.
          if [ -n "$BASE" ]; then
            from=$BASE
          elif printf '%s' "$BEFORE" | grep -q '[^0]' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            from=$BEFORE
          else
            from=$(git rev-parse "$HEAD~1")
          fi
          sh tools/hooks/check-range.sh "$from" "$HEAD"

  msrv:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        shell: pwsh
        run: |
          # Keep this in sync with rust-version in Cargo.toml.
          rustup toolchain install 1.96 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install minimum supported Rust.' }
      - name: Check minimum supported Rust
        run: cargo +1.96 check --workspace --all-targets --locked
