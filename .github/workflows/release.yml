name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: '1.96.0'
  CARGO_TERM_COLOR: always
  INNO_SETUP_VERSION: '6.7.1'

jobs:
  release:
    runs-on: windows-2025
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check tag and release availability
        if: github.event_name == 'push'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./installer/version.ps1
          $releaseVersion = Get-RosetunVersion
          if ($env:TAG -ne "v$($releaseVersion.Version)") {
            throw "Tag $env:TAG does not match Cargo.toml version $($releaseVersion.Version)."
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          $onMaster = $LASTEXITCODE -eq 0
          git merge-base --is-ancestor $env:GITHUB_SHA origin/dev
          $onDev = $LASTEXITCODE -eq 0
          # git exits with 1 when the commit is not an ancestor; do not fail the step on it.
          $global:LASTEXITCODE = 0
          # master carries the current version and its betas. Alphas and betas of the
          # next minor version are tagged on dev until that version reaches master.
          $masterManifest = git show origin/master:Cargo.toml | Out-String
          $global:LASTEXITCODE = 0
          $masterVersion = [regex]::Match($masterManifest, '(?ms)^\[workspace\.package\].*?^version\s*=\s*"(?<v>\d+)\.(?<m>\d+)\.')
          $tagVersion = [regex]::Match($releaseVersion.Version, '^(?<v>\d+)\.(?<m>\d+)\.\d+-(alpha|beta)\.')
          $nextMinor = $masterVersion.Success -and $tagVersion.Success -and (
            [int]$tagVersion.Groups['v'].Value -gt [int]$masterVersion.Groups['v'].Value -or (
              [int]$tagVersion.Groups['v'].Value -eq [int]$masterVersion.Groups['v'].Value -and
              [int]$tagVersion.Groups['m'].Value -gt [int]$masterVersion.Groups['m'].Value))
          if (-not ($onMaster -or ($onDev -and $nextMinor))) {
            throw "Tag $env:TAG must point to a commit on master, or on dev for an alpha or beta of the next version."
          }
          gh release view $env:TAG --json id 2>$null | Out-Null
          $exists = $LASTEXITCODE -eq 0
          # GitHub fails a pwsh step whose last native command exited non-zero.
          $global:LASTEXITCODE = 0
          if ($exists) { throw "Release $env:TAG already exists." }
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install Rust toolchain.' }
          rustup default $env:RUST_TOOLCHAIN
          if ($LASTEXITCODE -ne 0) { throw 'Failed to select Rust toolchain.' }
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $locations = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $locations | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --version $env:INNO_SETUP_VERSION -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Failed to install Inno Setup.' }
            $iscc = $locations | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe was not found after installing Inno Setup.' }
          [IO.File]::AppendAllText($env:GITHUB_ENV, "ISCC=$iscc`n", [Text.UTF8Encoding]::new($false))
      # No actions/cache here: a signed release must not start from a tool
      # binary that another run wrote. build.ps1 -Release installs cargo-about.
      - name: Install cargo-deny
        # Keep this version in sync with the deny job in ci.yml.
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check dependencies
        # Advisories published since the last CI run stop the release too.
        run: cargo deny --locked check --warn unmaintained
      - name: Build release assets
        id: build
        run: ./installer/build.ps1 -Release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push' && github.event.repository.visibility == 'public'
        with:
          subject-path: target/installer/rosetun-*-setup.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: rosetun-${{ steps.build.outputs.version }}-preview
          path: |
            ${{ steps.build.outputs.setup }}
            target/installer/SHA256SUMS.txt
            target/installer/release-notes.md
          if-no-files-found: error
          retention-days: 7
      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.build.outputs.version }}
          PRERELEASE: ${{ steps.build.outputs.prerelease }}
          SETUP: ${{ steps.build.outputs.setup }}
        run: |
          $sources = @(Get-ChildItem -LiteralPath 'target/installer' -Filter 'sing-box-*-source.tar.gz' -File)
          if ($sources.Count -ne 1) { throw 'Expected exactly one sing-box source archive.' }
          $xraySources = @(Get-ChildItem -LiteralPath 'target/installer' -Filter 'xray-*-source.tar.gz' -File)
          if ($xraySources.Count -ne 1) { throw 'Expected exactly one Xray source archive.' }
          $releaseArgs = @(
            $env:TAG
            $env:SETUP
            $sources[0].FullName
            $xraySources[0].FullName
            'target/installer/SHA256SUMS.txt'
            '--title'
            "Rosetun $env:VERSION"
            '--notes-file'
            'target/installer/release-notes.md'
            '--verify-tag'
          )
          if ($env:PRERELEASE -eq 'true') { $releaseArgs += '--prerelease' }
          gh release create @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish the release.' }
