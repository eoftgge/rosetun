name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: '1.99.1'
  CARGO_TERM_COLOR: always
  INNO_SETUP_VERSION: '6.7.1'

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      # Seeing existing draft releases via `gh release list` requires contents: write.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test release scripts
        run: python3 -m unittest discover -s tools/release -p "test_*.py"
      - name: Check tag and release availability
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release/assemble.py check-tag --tag "$TAG" --sha "$GITHUB_SHA"

  windows:
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - name: Run tests
        shell: bash
        run: cargo test --workspace --locked
      - name: Install Inno Setup if needed
        shell: bash
        run: |
          find_iscc() {
            for candidate in \
              '/c/Program Files (x86)/Inno Setup 6/ISCC.exe' \
              '/c/Program Files/Inno Setup 6/ISCC.exe'; do
              if [ -f "$candidate" ]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
            return 1
          }
          if ! iscc=$(find_iscc); then
            choco install innosetup --version "$INNO_SETUP_VERSION" -y --no-progress
            iscc=$(find_iscc)
          fi
          printf 'ISCC=%s\n' "$(cygpath -w "$iscc")" >>"$GITHUB_ENV"
      # No actions/cache here: a release must not start from a tool binary
      # that another run wrote. build.ps1 -Release installs cargo-about.
      - name: Install cargo-deny
        # Keep this version in sync with the deny job in ci.yml.
        shell: bash
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Check dependencies
        # Advisories published since the last CI run stop the release too.
        shell: bash
        run: cargo deny --locked check --warn unmaintained
      - name: Build release assets
        run: ./installer/build.ps1 -Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rosetun-windows
          path: |
            target/installer/rosetun-*-setup.exe
            target/installer/sing-box-*-source.tar.gz
            target/installer/xray-*-source.tar.gz
            target/installer/SHA256SUMS.txt
            target/installer/release-notes.md
          if-no-files-found: error
          retention-days: 1

  deb:
    needs: validate
    runs-on: ubuntu-24.04
    # Build and resolve dependencies on glibc 2.36, also usable on newer systems.
    container: debian:12-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends binutils ca-certificates curl dpkg-dev gcc git libc6-dev libegl1-mesa-dev libgl1-mesa-dev libstdc++6 libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcursor-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libxrender-dev pkg-config python3 shellcheck unzip xz-utils
          curl --fail --silent --show-error --location --proto '=https' \
            -o /tmp/rustup-init https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init
          echo '20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  /tmp/rustup-init' | sha256sum --check
          chmod 0755 /tmp/rustup-init
          useradd --create-home builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # build-deb.sh refuses root, and a clean environment keeps it from writing
      # to the runner's files. No actions/cache, as in the other release jobs.
      - name: Test and build the package
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env -i HOME=/home/builder PATH=/usr/local/bin:/usr/bin:/bin \
            RUST_TOOLCHAIN="$RUST_TOOLCHAIN" bash -euc '
              /tmp/rustup-init -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN" --component clippy,rustfmt --no-modify-path
              export PATH="$HOME/.cargo/bin:$PATH"
              cargo fmt --all --check
              cargo clippy -q --workspace --all-targets --locked -- -D warnings
              cargo test -q --workspace --locked
              python3 -m unittest discover -s installer/linux -p "test_*.py"
              shellcheck installer/linux/build-deb.sh installer/linux/build-archive.sh tools/vm/linux/build-artifacts.sh tools/vm/linux/build-in-wsl.sh
              installer/linux/build-deb.sh --release
              sha256sum target/deb/rosetun_*_amd64.deb > /tmp/rosetun-deb.sha256
              cargo clean -q --release
              installer/linux/build-deb.sh --release
              sha256sum --check /tmp/rosetun-deb.sha256
              dpkg-deb --field target/deb/rosetun_*_amd64.deb Depends
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rosetun-deb
          path: |
            target/deb/rosetun_*_amd64.deb
            target/deb/rosetun-*-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 1

  linux-dependencies:
    needs: deb
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image:
          - debian:12-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
          - debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
          - ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rosetun-deb
          path: packages
      - name: Resolve package dependencies without installing the service
        run: |
          apt-get update
          apt-get --simulate install ./packages/rosetun_*_amd64.deb

  arch:
    needs: deb
    runs-on: ubuntu-24.04
    container: archlinux@sha256:823e937464d1528b306a8e1137ef406b9c56e5fee43c7a19e93684d554af74e1
    steps:
      - name: Install packaging tools
        run: |
          pacman -Syu --noconfirm --needed base-devel namcap
          useradd --create-home builder
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rosetun-deb
          path: target/deb
      - name: Build and inspect the binary package without installing it
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash tools/arch/check-package.sh target/deb/rosetun-*-linux-amd64.tar.gz

  macos:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Apple Silicon runner
        run: |
          arch=$(uname -m)
          if [ "$arch" != "arm64" ]; then
            echo "Expected arm64 runner, got $arch" >&2
            exit 1
          fi
      # No actions/cache here: a release build must not start from cached build tools.
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
          rustc -vV
      - name: Validate and test on macOS
        run: |
          cargo fmt --all --check
          plutil -lint packaging/macos/io.github.eoftgge.rosetun.helper.plist
          sed -e 's/@SHORT_VERSION@/0.7.0/g' -e 's/@BUNDLE_VERSION@/0.7.0-beta.1/g' \
            packaging/macos/Info.plist.in | plutil -lint -
          sed -e 's/@VERSION@/0.7.0-beta.1/g' \
            packaging/macos/distribution.xml.in | xmllint --noout -
          bash -n installer/macos/build-pkg.sh packaging/macos/uninstall.sh \
            packaging/macos/scripts/preinstall packaging/macos/scripts/postinstall
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck installer/macos/build-pkg.sh packaging/macos/uninstall.sh \
              packaging/macos/scripts/preinstall packaging/macos/scripts/postinstall
          fi
          cargo test -q --workspace --locked --target aarch64-apple-darwin
      - name: Build macOS package
        id: build_macos
        env:
          MACOS_APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          MACOS_APP_CERT_PASSWORD: ${{ secrets.MACOS_APP_CERT_PASSWORD }}
          MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_APP: ${{ secrets.APPLE_DEVELOPER_ID_APP }}
          APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MACOS_APP_CERT_P12" ] && [ -n "$MACOS_INSTALLER_CERT_P12" ]; then
            keychain="$RUNNER_TEMP/rosetun-build.keychain-db"
            keychain_password=$(uuidgen)
            security create-keychain -p "$keychain_password" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "$keychain_password" "$keychain"
            security list-keychains -d user -s "$keychain" login.keychain-db

            app_p12="$RUNNER_TEMP/app-cert.p12"
            installer_p12="$RUNNER_TEMP/installer-cert.p12"
            printf '%s' "$MACOS_APP_CERT_P12" | base64 --decode >"$app_p12"
            printf '%s' "$MACOS_INSTALLER_CERT_P12" | base64 --decode >"$installer_p12"
            security import "$app_p12" -P "$MACOS_APP_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
            security import "$installer_p12" -P "$MACOS_INSTALLER_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain"
            rm -f "$app_p12" "$installer_p12"

            if [ -n "$APPLE_API_KEY_P8" ]; then
              api_key_path="$RUNNER_TEMP/AuthKey.p8"
              printf '%s' "$APPLE_API_KEY_P8" | base64 --decode >"$api_key_path"
              chmod 0600 "$api_key_path"
              export APPLE_API_KEY_PATH="$api_key_path"
            fi
            bash installer/macos/build-pkg.sh --release
          else
            bash installer/macos/build-pkg.sh --release --allow-unsigned
          fi
      - name: Clean up temporary signing credentials
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/rosetun-build.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/rosetun-build.keychain-db" || true
          fi
          rm -f "$RUNNER_TEMP/app-cert.p12" "$RUNNER_TEMP/installer-cert.p12" "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rosetun-macos
          path: target/macos/rosetun-*-macos-arm64-experimental.pkg
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [windows, deb, linux-dependencies, arch, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rosetun-windows
          path: target/installer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rosetun-deb
          path: target/installer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rosetun-macos
          path: target/installer
      - name: Assemble release checksums and notes
        id: assemble
        run: python3 tools/release/assemble.py assemble --dir target/installer
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push' && github.event.repository.visibility == 'public'
        with:
          subject-path: |
            target/installer/rosetun-*-setup.exe
            target/installer/rosetun_*_amd64.deb
            target/installer/rosetun-*-linux-amd64.tar.gz
            target/installer/rosetun-*-macos-arm64-experimental.pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: rosetun-${{ steps.assemble.outputs.version }}-preview
          path: |
            ${{ steps.assemble.outputs.setup }}
            ${{ steps.assemble.outputs.deb }}
            ${{ steps.assemble.outputs.archive }}
            ${{ steps.assemble.outputs.macos }}
            ${{ steps.assemble.outputs.sums }}
            ${{ steps.assemble.outputs.notes }}
          if-no-files-found: error
          retention-days: 7
      - name: Create the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.assemble.outputs.version }}
          PRERELEASE: ${{ steps.assemble.outputs.prerelease }}
          SETUP: ${{ steps.assemble.outputs.setup }}
          DEB: ${{ steps.assemble.outputs.deb }}
          ARCHIVE: ${{ steps.assemble.outputs.archive }}
          MACOS: ${{ steps.assemble.outputs.macos }}
          SING_BOX_SOURCE: ${{ steps.assemble.outputs.sing_box_source }}
          XRAY_SOURCE: ${{ steps.assemble.outputs.xray_source }}
          SUMS: ${{ steps.assemble.outputs.sums }}
          NOTES: ${{ steps.assemble.outputs.notes }}
        run: |
          args=(
            "$TAG"
            "$SETUP"
            "$DEB"
            "$ARCHIVE"
            "$MACOS"
            "$SING_BOX_SOURCE"
            "$XRAY_SOURCE"
            "$SUMS"
            --title "Rosetun $VERSION"
            --notes-file "$NOTES"
            --verify-tag
            # The owner signs SHA256SUMS.txt locally, then publishes the draft.
            --draft
          )
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
