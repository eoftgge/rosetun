schema = "rosetun.matrix.execution.windows.v1"
suite = "windows-boot-smoke"
mode = "exploratory"
platform = "linux-x86_64-kvm"
# A state directory of its own: a diagnostic run is not a qualification and shares no stand with one.
state_directory = "/srv/rosetun-state-windows"
stand_id = "windows-boot-smoke-example"
# The image.json the image build of stage 9a wrote; the controller reads it strictly and hashes the disk, the
# firmware variables and the TPM files it names. Its `qualified` must be false, and it is.
image_descriptor = "/srv/rosetun-images/windows-11-26h2-pro-v1/image.json"

[qemu]
schema = "rosetun.matrix.qemu.v1"
executable = "/opt/qemu-10.0.13/bin/qemu-system-x86_64"
image_executable = "/opt/qemu-10.0.13/bin/qemu-img"
# The firmware code of the image, the same file the descriptor names (uefi.code.path).
bios = "/srv/rosetun-images/firmware/OVMF_CODE.fd"
machine = "q35"
accelerator = "kvm"
cpu = "host"
# Memory and vCPUs of the image's devices, as its descriptor says.
memory_mib = 4096
vcpus = 4
qga = true
swtpm = "/usr/bin/swtpm"

[smoke]
# How long the controller watches the running machine before it takes the screenshot.
boot_wait_seconds = 90
# How long the guest may take to shut down after the ACPI power-down request.
shutdown_wait_seconds = 180

[deadlines]
# Preparation hashes the whole disk of the image several times.
preparation = 900
