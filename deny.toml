# cargo-deny configuration for the version pinned in .github/workflows/ci.yml.
# Build and dev dependencies are checked too: a vulnerability there matters.

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Vulnerabilities always fail. Unmaintained crates are reported as warnings
# because CI passes `--warn unmaintained`; this schema has no warning level
# for them.
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
# Keep this list identical to `accepted` in about.toml, in the same order.
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
# windows-sys alone comes in several versions that cannot be unified.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
