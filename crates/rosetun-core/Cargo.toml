[package]
name = "rosetun-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The GUI's system check: it reads adapters, processes and desktop settings,
# which the CLI has no use for and should not carry.
system-checks = ["dep:rosetun-adapters", "dep:rosetun-processes", "dep:rosetun-shell"]

[dependencies]
rosetun-config.workspace = true
rosetun-dns.workspace = true
rosetun-subscription.workspace = true
rosetun-hwid.workspace = true
rosetun-adapters = { workspace = true, optional = true }
rosetun-processes = { workspace = true, optional = true }
rosetun-ipc.workspace = true
base64.workspace = true
percent-encoding.workspace = true
ureq = { workspace = true, features = ["rustls", "platform-verifier", "gzip"] }
url.workspace = true
idna.workspace = true
regex-automata.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
rosetun-engine.workspace = true
rosetun-engine-singbox.workspace = true

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
rosetun-shell = { workspace = true, optional = true }

[lints]
workspace = true
