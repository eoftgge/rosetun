[package]
name = "rosetun-routing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rosetun-config.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Lockdown flushes the registry hive BFE keeps its persistent policy in.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Registry"] }

# Route queries and interface inspection use libc syscalls on Linux and macOS.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc.workspace = true

[lints]
workspace = true
